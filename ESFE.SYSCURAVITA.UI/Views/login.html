<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Curavita - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #1c909b;
            --primary-dark: #277c95;
            --bg-light: #eef5f7;
            --card-celeste: #f2f9fa;
            --white: #FFFFFF;
            --border-color: #b2cfd6;
            --text-muted: #5a7b85;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        html, body {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        input::-ms-reveal,
        input::-ms-clear,
        input::-webkit-contacts-auto-fill-button,
        input::-webkit-credentials-auto-fill-button {
            display: none !important;
            visibility: hidden !important;
            pointer-events: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        /* Ajustes de espacio y margen para encajar con el tamaño de la ventana de C# */
        .login-card {
            width: 380px;
            background: var(--card-celeste);
            padding: 22px 24px 18px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(39, 124, 149, 0.12);
            border: 1px solid rgba(178, 207, 214, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        .login-logo {
            max-width: 95px;
            width: 100%;
            height: auto;
            display: block;
        }

        h2 {
            color: var(--primary-dark);
            font-size: 15px;
            margin-bottom: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: center;
            width: 100%;
        }

        .form-group {
            width: 100%;
            margin-bottom: 14px;
            text-align: left;
        }

            .form-group label {
                display: block;
                margin-bottom: 6px;
                color: var(--primary-dark);
                font-weight: 600;
                font-size: 11.5px;
            }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .form-control {
            width: 100%;
            height: 38px;
            padding: 8px 36px 8px 10px;
            border: 1px solid var(--border-color);
            background-color: var(--white);
            border-radius: 8px;
            font-size: 12.5px;
            color: #2c3e50;
            outline: none;
            transition: all 0.2s ease;
        }

            .form-control:focus {
                border-color: var(--primary-green);
                box-shadow: 0 0 0 3px rgba(28, 144, 155, 0.15);
            }

        .pass-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            padding: 2px;
            z-index: 10;
        }

            .pass-toggle:hover {
                color: var(--primary-green);
            }

        .options-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            margin-top: 4px;
            margin-bottom: 18px;
            color: var(--text-muted);
        }

            .options-bar label {
                display: flex;
                align-items: center;
                gap: 5px;
                cursor: pointer;
                white-space: nowrap;
            }

            .options-bar input[type="checkbox"] {
                accent-color: var(--primary-green);
            }

            .options-bar a {
                color: var(--primary-dark);
                text-decoration: none;
                font-weight: 600;
                white-space: nowrap;
            }

                .options-bar a:hover {
                    color: var(--primary-green);
                    text-decoration: underline;
                }

        .btn-login {
            width: 100%;
            height: 40px;
            background: var(--primary-dark);
            color: var(--white);
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(39, 124, 149, 0.2);
        }

            .btn-login:hover {
                background: var(--primary-green);
                box-shadow: 0 4px 12px rgba(28, 144, 155, 0.3);
            }

        .footer-links {
            width: 100%;
            margin-top: 16px;
            font-size: 10.5px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <img src="logo.png" alt="Curavita" class="login-logo">
        </div>

        <h2>INICIAR SESIÓN</h2>

        <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" id="txtCorreo" class="form-control" placeholder="usuario@curavita.digital" autocomplete="off">
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <div class="input-wrapper">
                <input type="password" id="txtContrasena" class="form-control" placeholder="••••••••" autocomplete="off">
                <div id="togglePassword" class="pass-toggle" title="Mostrar contraseña">
                    <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                    <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </div>
            </div>
        </div>

        <div class="options-bar">
            <label>
                <input type="checkbox"> Recuérdame
            </label>
            <a href="#">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="button" id="btnLogin" class="btn-login">INICIAR SESIÓN</button>

        <p class="footer-links">¿Necesitas ayuda? | Términos y Condiciones</p>
    </div>

    <script>
        const correoInput = document.getElementById('txtCorreo');
        const passwordInput = document.getElementById('txtContrasena');
        const togglePassword = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeOffIcon = document.getElementById('eyeOffIcon');
        const btnLogin = document.getElementById('btnLogin');

        // Mostrar / Ocultar contraseña
        togglePassword.addEventListener('click', function (e) {
            e.stopPropagation();
            const estaOculto = passwordInput.getAttribute('type') === 'password';

            if (estaOculto) {
                passwordInput.setAttribute('type', 'text');
                eyeOffIcon.style.display = 'none';
                eyeIcon.style.display = 'block';
                togglePassword.setAttribute('title', 'Ocultar contraseña');
            } else {
                passwordInput.setAttribute('type', 'password');
                eyeIcon.style.display = 'none';
                eyeOffIcon.style.display = 'block';
                togglePassword.setAttribute('title', 'Mostrar contraseña');
            }
        });

        // Función para procesar y enviar los datos a C#
        function ejecutarInicioSesion() {
            const correoVal = correoInput.value.trim();
            const contrasenaVal = passwordInput.value.trim();

            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(JSON.stringify({
                    correo: correoVal,
                    contrasena: contrasenaVal
                }));
            }
        }

        // Evento Click del botón
        btnLogin.addEventListener('click', ejecutarInicioSesion);

        // Permitir presionar la tecla Enter desde la contraseña
        passwordInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                ejecutarInicioSesion();
            }
        });
    </script>
</body>
</html>
