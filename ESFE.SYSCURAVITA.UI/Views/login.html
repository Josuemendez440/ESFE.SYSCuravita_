<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Curavita - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <img src="logo.png" alt="Curavita" class="login-logo">
        </div>

        <h2>INICIAR SESIÓN</h2>

        <!-- Alerta de campos incompletos -->
        <div id="errorMsg" class="error-msg">Por favor, complete todos los campos.</div>

        <div class="form-group">
            <label for="txtCorreo">Correo Electrónico</label>
            <input type="email" id="txtCorreo" class="form-control" placeholder="usuario@curavita.digital" autocomplete="off">
        </div>

        <div class="form-group">
            <label for="txtContrasena">Contraseña</label>
            <div class="input-wrapper">
                <input type="password" id="txtContrasena" class="form-control" placeholder="••••••••" autocomplete="off">
                <div id="togglePassword" class="pass-toggle" title="Mostrar contraseña">
                    <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                    <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </div>
            </div>
        </div>

        <div class="options-bar">
            <label>
                <input type="checkbox" id="chkRecordar"> Recuérdame
            </label>
            <a href="#" id="lnkOlvidaste">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="button" id="btnLogin" class="btn-login">INICIAR SESIÓN</button>

        <p class="footer-links">¿Necesitas ayuda? | Términos y Condiciones</p>
    </div>

    <script src="login.js"></script>
</body>
</html>
